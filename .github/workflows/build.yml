name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NCNN_VERSION: '20240410'
  NDK_VERSION: '25.2.9519653'
  CMAKE_VERSION: '3.22.1'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      # The prebuilt ncnn is 77 MB extracted and is not kept in the repo
      # (setup_toolchain.sh fetches it locally). Cache it so only the first
      # run on a new version pays the download.
      - name: Cache ncnn
        id: cache-ncnn
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/libs/ncnn
          key: ncnn-${{ env.NCNN_VERSION }}-android-vulkan

      - name: Fetch ncnn
        if: steps.cache-ncnn.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          NAME="ncnn-${NCNN_VERSION}-android-vulkan"
          curl -fsSL -o /tmp/ncnn.zip \
            "https://github.com/Tencent/ncnn/releases/download/${NCNN_VERSION}/${NAME}.zip"
          unzip -q /tmp/ncnn.zip -d /tmp/ncnn
          mkdir -p app/src/main/cpp/libs/ncnn
          cp -r "/tmp/ncnn/${NAME}"/* app/src/main/cpp/libs/ncnn/
          test -f app/src/main/cpp/libs/ncnn/arm64-v8a/include/ncnn/net.h

      - name: Check shaders compile
        run: python3 tools/check_shaders.py
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the artifact
        id: name
        run: echo "name=retro-ai-scaler-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Tagging v1.2.3 publishes a release with the APK attached.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
