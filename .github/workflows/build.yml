name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read by default; the job asks for the one write it needs.
#
# Without this block the token inherits the repository default, which is
# read-only - so everything built and signed correctly and only the very last
# step failed, with "Resource not accessible by integration". Declaring the
# scope here rather than flipping the repository setting to read-write keeps
# every OTHER workflow that may exist later on the safe default.
permissions:
  contents: read

env:
  NCNN_VERSION: '20240410'
  NDK_VERSION: '25.2.9519653'
  CMAKE_VERSION: '3.22.1'

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed only by the "Publish release" step, which creates a release and
    # uploads the APK to it.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      # The prebuilt ncnn is 77 MB extracted and is not kept in the repo
      # (setup_toolchain.sh fetches it locally). Cache it so only the first
      # run on a new version pays the download.
      - name: Cache ncnn
        id: cache-ncnn
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/libs/ncnn
          key: ncnn-${{ env.NCNN_VERSION }}-android-vulkan

      - name: Fetch ncnn
        if: steps.cache-ncnn.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          NAME="ncnn-${NCNN_VERSION}-android-vulkan"
          curl -fsSL -o /tmp/ncnn.zip \
            "https://github.com/Tencent/ncnn/releases/download/${NCNN_VERSION}/${NAME}.zip"
          unzip -q /tmp/ncnn.zip -d /tmp/ncnn
          mkdir -p app/src/main/cpp/libs/ncnn
          cp -r "/tmp/ncnn/${NAME}"/* app/src/main/cpp/libs/ncnn/
          test -f app/src/main/cpp/libs/ncnn/arm64-v8a/include/ncnn/net.h

      - name: Check shaders compile
        run: python3 tools/check_shaders.py
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Only on a tag. Every other push builds and uploads a debug APK, which
      # needs no secret at all - and a pull request from a fork could not read
      # one anyway.
      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set - a tag build cannot be signed."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # Never echo the path's contents, only that it arrived intact.
          echo "keystore decoded, $(wc -c < "$RUNNER_TEMP/release.jks") bytes"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # One step for both, keyed off whether the keystore was decoded. Gradle
      # refuses to assemble a release without all four variables (see
      # app/build.gradle.kts), so a tag build cannot silently fall back to the
      # committed debug key.
      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          if [ -n "${SIGNING_KEYSTORE_FILE:-}" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
            echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
            echo "APK_PATH=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      # always(), because a failed build must not leave the key on the runner.
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Name the artifact
        id: name
        run: echo "name=retro-ai-scaler-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      # Tagging v1.2.3 publishes a release with the signed APK attached.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
